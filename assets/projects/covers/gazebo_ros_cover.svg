<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" style="background:#0a0a0b">
  <defs>
    <pattern id="grid_gazebo_ros" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00c2c7" stroke-width="0.3" opacity="0.2"/>
    </pattern>
    <pattern id="smallgrid_gazebo_ros" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#00c2c7" stroke-width="0.15" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="550" fill="#0a0a0b"/>
  <!-- Fine grid -->
  <rect width="800" height="550" fill="url(#smallgrid_gazebo_ros)"/>
  <!-- Main grid -->
  <rect width="800" height="550" fill="url(#grid_gazebo_ros)"/>
  <!-- Corner markers -->
  <g stroke="#00c2c7" stroke-width="1.5" opacity="0.8">
    <path d="M 20 20 L 20 50"/>
    <path d="M 20 20 L 50 20"/>
    <path d="M 780 20 L 780 50"/>
    <path d="M 780 20 L 750 20"/>
    <path d="M 20 530 L 20 500"/>
    <path d="M 20 530 L 50 530"/>
    <path d="M 780 530 L 780 500"/>
    <path d="M 780 530 L 750 530"/>
  </g>
  <!-- Category label top left -->
  <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.8" letter-spacing="2">AUTONOMOUS SYSTEMS</text>
  <!-- Title label bottom left -->
  <text x="30" y="540" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.6" letter-spacing="1">ROS 2 AMR  GAZEBO NAVIGATION SIMULATION</text>
  <!-- Drawing content -->
  
  <!-- Map environment -->
  <rect x="60" y="80" width="500" height="400" fill="#0d0d0f" stroke="#00c2c7" stroke-width="1"/>
  <!-- Map obstacles -->
  <rect x="120" y="120" width="80" height="60" fill="#1a1a1e" stroke="#00c2c7" stroke-width="1.5"/>
  <rect x="300" y="150" width="100" height="80" fill="#1a1a1e" stroke="#00c2c7" stroke-width="1.5"/>
  <rect x="150" y="340" width="60" height="80" fill="#1a1a1e" stroke="#00c2c7" stroke-width="1.5"/>
  <rect x="400" y="360" width="90" height="50" fill="#1a1a1e" stroke="#00c2c7" stroke-width="1.5"/>
  <!-- Robot base -->
  <circle cx="230" cy="290" r="24" fill="#111113" stroke="#4a9eff" stroke-width="2.5"/>
  <circle cx="230" cy="290" r="14" fill="none" stroke="#4a9eff" stroke-width="1.5" opacity="0.6"/>
  <!-- LiDAR scan arcs -->
  <circle cx="230" cy="290" r="60" fill="none" stroke="#00c2c7" stroke-width="0.7" opacity="0.3" stroke-dasharray="5 4"/>
  <circle cx="230" cy="290" r="100" fill="none" stroke="#00c2c7" stroke-width="0.5" opacity="0.2" stroke-dasharray="5 4"/>
  <!-- Nav path -->
  <polyline points="230,290 280,250 350,240 420,280 430,350" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 4" opacity="0.8"/>
  <!-- Goal marker -->
  <circle cx="430" cy="350" r="12" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <text x="430" y="354" font-family="JetBrains Mono" font-size="7" fill="#10b981" text-anchor="middle">GOAL</text>
  <!-- Start marker -->
  <text x="230" y="294" font-family="JetBrains Mono" font-size="7" fill="#4a9eff" text-anchor="middle">AMR</text>
  <!-- ROS 2 block diagram right side -->
  <rect x="600" y="100" width="170" height="60" rx="4" fill="#111113" stroke="#00c2c7" stroke-width="1.5"/>
  <text x="685" y="127" font-family="JetBrains Mono" font-size="9" fill="#00c2c7" text-anchor="middle">ROS 2 / NAV2</text>
  <text x="685" y="147" font-family="JetBrains Mono" font-size="7" fill="#00c2c7" text-anchor="middle" opacity="0.6">Humble Hawksbill</text>
  <rect x="600" y="190" width="170" height="60" rx="4" fill="#111113" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="685" y="218" font-family="JetBrains Mono" font-size="9" fill="#4a9eff" text-anchor="middle">MICRO-ROS</text>
  <text x="685" y="238" font-family="JetBrains Mono" font-size="7" fill="#4a9eff" text-anchor="middle" opacity="0.6">ESP32 Agent</text>
  <rect x="600" y="280" width="170" height="60" rx="4" fill="#111113" stroke="#10b981" stroke-width="1.5"/>
  <text x="685" y="308" font-family="JetBrains Mono" font-size="9" fill="#10b981" text-anchor="middle">GAZEBO SIM</text>
  <text x="685" y="328" font-family="JetBrains Mono" font-size="7" fill="#10b981" text-anchor="middle" opacity="0.6">Physics Engine</text>
  <!-- Connecting lines -->
  <line x1="600" y1="130" x2="560" y2="130" stroke="#00c2c7" stroke-width="1" opacity="0.5"/>
  <line x1="560" y1="130" x2="560" y2="290" stroke="#00c2c7" stroke-width="1" opacity="0.3"/>
  <!-- Bottom label -->
  <text x="300" y="510" font-family="JetBrains Mono" font-size="9" fill="#00c2c7" text-anchor="middle" letter-spacing="2">AUTONOMOUS MOBILE ROBOT  ROS 2 NAVIGATION STACK</text>

</svg>