<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" style="background:#0a0a0b">
  <defs>
    <pattern id="grid_b747" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00c2c7" stroke-width="0.3" opacity="0.2"/>
    </pattern>
    <pattern id="smallgrid_b747" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#00c2c7" stroke-width="0.15" opacity="0.12"/>
    </pattern>
    <linearGradient id="mach_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00c2c7" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#ffaa00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#0a0a0b"/>
  <rect width="800" height="550" fill="url(#smallgrid_b747)"/>
  <rect width="800" height="550" fill="url(#grid_b747)"/>

  <!-- Technical Corner Marks -->
  <g stroke="#00c2c7" stroke-width="1.5" opacity="0.8">
    <path d="M 20 20 L 20 50"/>
    <path d="M 20 20 L 50 20"/>
    <path d="M 780 20 L 780 50"/>
    <path d="M 780 20 L 750 20"/>
    <path d="M 20 530 L 20 500"/>
    <path d="M 20 530 L 50 530"/>
    <path d="M 780 530 L 780 500"/>
    <path d="M 780 530 L 750 530"/>
  </g>

  <!-- Top metadata -->
  <text x="30" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.8" letter-spacing="2">AEROSPACE &amp; CFD ANALYSIS</text>
  <text x="770" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.6" text-anchor="end" letter-spacing="1">ANSYS FLUENT · SOLIDWORKS CAD</text>

  <!-- Bottom metadata -->
  <text x="30" y="536" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.6" letter-spacing="1">BOEING 747 FLUID FLOW &amp; FEA STRUCTURAL STUDY</text>
  <text x="770" y="536" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.6" text-anchor="end" letter-spacing="1">CRUISE: V = 265.5 m/s · ALT: 12,192 m</text>

  <!-- Center Aircraft Top/Iso Blueprint -->
  <g transform="translate(400, 275)" stroke="#00c2c7" stroke-width="1.2" fill="none">
    <!-- Streamlines background -->
    <path d="M -340 -160 C -150 -140 100 -180 340 -160" stroke="url(#mach_grad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
    <path d="M -340 -90 C -100 -80 80 -100 340 -90" stroke="url(#mach_grad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
    <path d="M -340 0 C -80 -10 120 10 340 0" stroke="url(#mach_grad)" stroke-width="2" opacity="0.6"/>
    <path d="M -340 90 C -100 80 80 100 340 90" stroke="url(#mach_grad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
    <path d="M -340 160 C -150 140 100 180 340 160" stroke="url(#mach_grad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

    <!-- Fuselage -->
    <path d="M -240 0 C -220 -28 -140 -35 -50 -35 L 80 -35 C 170 -35 220 -15 250 0 C 220 15 170 35 80 35 L -50 35 C -140 35 -220 28 -240 0 Z" fill="#11141a" stroke="#00c2c7" stroke-width="1.8"/>
    <!-- Cockpit hump and cabin line -->
    <path d="M -210 -10 C -190 -30 -130 -38 -80 -36" stroke="#00c2c7" stroke-width="1.4" opacity="0.8"/>
    <ellipse cx="-210" cy="-5" rx="12" ry="6" fill="none" stroke="#00c2c7" stroke-width="1" opacity="0.7"/>

    <!-- Main Swept Wings -->
    <!-- Left Wing -->
    <path d="M -30 -35 L 40 -200 L 90 -200 L 40 -35 Z" fill="#131822" stroke="#00c2c7" stroke-width="1.6"/>
    <!-- Left Wing engines -->
    <rect x="-2" y="-125" width="28" height="14" rx="4" fill="#1c2330" stroke="#00c2c7" stroke-width="1.2"/>
    <rect x="22" y="-165" width="24" height="12" rx="4" fill="#1c2330" stroke="#00c2c7" stroke-width="1.2"/>
    <!-- Right Wing -->
    <path d="M -30 35 L 40 200 L 90 200 L 40 35 Z" fill="#131822" stroke="#00c2c7" stroke-width="1.6"/>
    <!-- Right Wing engines -->
    <rect x="-2" y="111" width="28" height="14" rx="4" fill="#1c2330" stroke="#00c2c7" stroke-width="1.2"/>
    <rect x="22" y="153" width="24" height="12" rx="4" fill="#1c2330" stroke="#00c2c7" stroke-width="1.2"/>

    <!-- Horizontal Stabilizers -->
    <path d="M 180 -25 L 230 -85 L 250 -85 L 225 -15 Z" fill="#131822" stroke="#00c2c7" stroke-width="1.4"/>
    <path d="M 180 25 L 230 85 L 250 85 L 225 15 Z" fill="#131822" stroke="#00c2c7" stroke-width="1.4"/>

    <!-- Centerline and dimension markers -->
    <line x1="-270" y1="0" x2="280" y2="0" stroke="#00c2c7" stroke-dasharray="4 4" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Telemetry HUD Boxes -->
  <g transform="translate(50, 60)">
    <rect width="170" height="80" rx="4" fill="#0d1117" stroke="#00c2c7" stroke-width="0.8" opacity="0.85"/>
    <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" letter-spacing="1">CFD AERODYNAMICS</text>
    <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="bold">Realizable k–ε</text>
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#88a0b5">Pressure-Based Solver</text>
    <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7">ΔP: -54.5 to +41.6 kPa</text>
  </g>

  <g transform="translate(580, 60)">
    <rect width="170" height="80" rx="4" fill="#0d1117" stroke="#00c2c7" stroke-width="0.8" opacity="0.85"/>
    <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" letter-spacing="1">FEA STRUCTURAL STUDY</text>
    <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="bold">4 Material Solves</text>
    <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#88a0b5">Carbon Fiber UD Composite</text>
    <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7">Specific Str: 375 kJ/kg</text>
  </g>
</svg>
