<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" style="background:#0a0a0b">
  <defs>
    <pattern id="grid_siemens_mcd" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00c2c7" stroke-width="0.3" opacity="0.2"/>
    </pattern>
    <pattern id="smallgrid_siemens_mcd" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#00c2c7" stroke-width="0.15" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="550" fill="#0a0a0b"/>
  <!-- Fine grid -->
  <rect width="800" height="550" fill="url(#smallgrid_siemens_mcd)"/>
  <!-- Main grid -->
  <rect width="800" height="550" fill="url(#grid_siemens_mcd)"/>
  <!-- Corner markers -->
  <g stroke="#00c2c7" stroke-width="1.5" opacity="0.8">
    <path d="M 20 20 L 20 50"/>
    <path d="M 20 20 L 50 20"/>
    <path d="M 780 20 L 780 50"/>
    <path d="M 780 20 L 750 20"/>
    <path d="M 20 530 L 20 500"/>
    <path d="M 20 530 L 50 530"/>
    <path d="M 780 530 L 780 500"/>
    <path d="M 780 530 L 750 530"/>
  </g>
  <!-- Category label top left -->
  <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.8" letter-spacing="2">CAD &amp; DIGITAL TWIN</text>
  <!-- Title label bottom left -->
  <text x="30" y="540" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.6" letter-spacing="1">SIEMENS MCD  DIGITAL TWIN SIMULATION</text>
  <!-- Drawing content -->
  
  <!-- Conveyor body -->
  <rect x="100" y="260" width="600" height="40" rx="4" fill="#111113" stroke="#00c2c7" stroke-width="2"/>
  <!-- Belt surface -->
  <rect x="100" y="262" width="600" height="8" fill="#00c2c7" opacity="0.15"/>
  <!-- Belt pattern -->
  <line x1="100" y1="270" x2="700" y2="270" stroke="#00c2c7" stroke-width="0.5" opacity="0.4"/>
  <line x1="140" y1="260" x2="140" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="190" y1="260" x2="190" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="240" y1="260" x2="240" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="290" y1="260" x2="290" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="340" y1="260" x2="340" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="390" y1="260" x2="390" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="440" y1="260" x2="440" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="490" y1="260" x2="490" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="540" y1="260" x2="540" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="590" y1="260" x2="590" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="640" y1="260" x2="640" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <line x1="690" y1="260" x2="690" y2="300" stroke="#00c2c7" stroke-width="0.5" opacity="0.3"/>
  <!-- Drive rollers -->
  <circle cx="100" cy="280" r="22" fill="#1a1a1e" stroke="#00c2c7" stroke-width="2"/>
  <circle cx="700" cy="280" r="22" fill="#1a1a1e" stroke="#00c2c7" stroke-width="2"/>
  <!-- Workpiece on conveyor -->
  <rect x="310" y="230" width="60" height="30" rx="3" fill="#1a1a1e" stroke="#4a9eff" stroke-width="2"/>
  <text x="340" y="249" font-family="JetBrains Mono" font-size="8" fill="#4a9eff" text-anchor="middle">PART</text>
  <!-- Sensor boxes -->
  <rect x="250" y="220" width="18" height="40" rx="2" fill="#111113" stroke="#00c2c7" stroke-width="1.5"/>
  <line x1="259" y1="220" x2="259" y2="310" stroke="#00c2c7" stroke-width="0.8" opacity="0.4" stroke-dasharray="4 2"/>
  <text x="259" y="315" font-family="JetBrains Mono" font-size="7" fill="#00c2c7" text-anchor="middle">SENSOR</text>
  <!-- Actuator piston -->
  <rect x="400" y="170" width="20" height="90" rx="3" fill="#111113" stroke="#00c2c7" stroke-width="1.5"/>
  <rect x="395" y="200" width="30" height="30" rx="2" fill="#1a1a1e" stroke="#00c2c7" stroke-width="1"/>
  <text x="410" y="160" font-family="JetBrains Mono" font-size="7" fill="#00c2c7" text-anchor="middle">ACTUATOR</text>
  <!-- Control lines -->
  <line x1="268" y1="240" x2="395" y2="215" stroke="#4a9eff" stroke-width="1" opacity="0.6" stroke-dasharray="5 3"/>
  <!-- Title text -->
  <text x="400" y="390" font-family="JetBrains Mono" font-size="10" fill="#00c2c7" text-anchor="middle" letter-spacing="2">SIEMENS MCD  MECHATRONICS SIMULATION</text>
  <text x="400" y="410" font-family="JetBrains Mono" font-size="8" fill="#00c2c7" text-anchor="middle" opacity="0.6">RIGID BODY · FRICTION CONTACT · SENSOR-ACTUATOR LOGIC</text>

</svg>