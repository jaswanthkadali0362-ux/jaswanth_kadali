<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" style="background:#0a0a0b">
  <defs>
    <pattern id="grid_atv" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00c2c7" stroke-width="0.3" opacity="0.2"/>
    </pattern>
    <pattern id="smallgrid_atv" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#00c2c7" stroke-width="0.15" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="800" height="550" fill="#0a0a0b"/>
  <!-- Fine grid -->
  <rect width="800" height="550" fill="url(#smallgrid_atv)"/>
  <!-- Main grid -->
  <rect width="800" height="550" fill="url(#grid_atv)"/>
  <!-- Corner markers -->
  <g stroke="#00c2c7" stroke-width="1.5" opacity="0.8">
    <path d="M 20 20 L 20 50"/>
    <path d="M 20 20 L 50 20"/>
    <path d="M 780 20 L 780 50"/>
    <path d="M 780 20 L 750 20"/>
    <path d="M 20 530 L 20 500"/>
    <path d="M 20 530 L 50 530"/>
    <path d="M 780 530 L 780 500"/>
    <path d="M 780 530 L 750 530"/>
  </g>
  <!-- Category label top left -->
  <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.8" letter-spacing="2">AUTOMOTIVE / MECHANICAL</text>
  <!-- Title label bottom left -->
  <text x="30" y="540" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c2c7" opacity="0.6" letter-spacing="1">FOMBI ATV  TELESCOPIC STEERING MECHANISM</text>
  <!-- Drawing content -->
  
  <!-- Chassis outline -->
  <rect x="100" y="150" width="600" height="250" rx="8" fill="#0d0d0f" stroke="#00c2c7" stroke-width="1.5" opacity="0.9"/>
  <!-- Roll cage lines -->
  <line x1="200" y1="150" x2="200" y2="400" stroke="#00c2c7" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="150" x2="400" y2="400" stroke="#00c2c7" stroke-width="1" opacity="0.5"/>
  <line x1="600" y1="150" x2="600" y2="400" stroke="#00c2c7" stroke-width="1" opacity="0.5"/>
  <!-- Diagonal bracing -->
  <line x1="100" y1="150" x2="400" y2="275" stroke="#00c2c7" stroke-width="1" opacity="0.3"/>
  <line x1="700" y1="150" x2="400" y2="275" stroke="#00c2c7" stroke-width="1" opacity="0.3"/>
  <!-- Steering column - telescopic -->
  <rect x="340" y="180" width="22" height="120" rx="4" fill="#111113" stroke="#00c2c7" stroke-width="2"/>
  <rect x="347" y="200" width="8" height="100" rx="2" fill="#00c2c7" opacity="0.4"/>
  <!-- Adjustment notches on column -->
  <line x1="340" y1="230" x2="362" y2="230" stroke="#00c2c7" stroke-width="1.5" opacity="0.8"/>
  <line x1="340" y1="250" x2="362" y2="250" stroke="#00c2c7" stroke-width="1.5" opacity="0.8"/>
  <line x1="340" y1="270" x2="362" y2="270" stroke="#00c2c7" stroke-width="1.5" opacity="0.8"/>
  <!-- Steering wheel -->
  <circle cx="351" cy="165" r="38" fill="none" stroke="#00c2c7" stroke-width="3"/>
  <circle cx="351" cy="165" r="10" fill="#00c2c7" opacity="0.3"/>
  <line x1="313" y1="165" x2="389" y2="165" stroke="#00c2c7" stroke-width="2"/>
  <line x1="351" y1="127" x2="351" y2="203" stroke="#00c2c7" stroke-width="2"/>
  <!-- Wheels -->
  <ellipse cx="150" cy="200" rx="40" ry="50" fill="#111113" stroke="#00c2c7" stroke-width="2.5"/>
  <ellipse cx="650" cy="200" rx="40" ry="50" fill="#111113" stroke="#00c2c7" stroke-width="2.5"/>
  <ellipse cx="150" cy="360" rx="40" ry="50" fill="#111113" stroke="#00c2c7" stroke-width="2.5"/>
  <ellipse cx="650" cy="360" rx="40" ry="50" fill="#111113" stroke="#00c2c7" stroke-width="2.5"/>
  <!-- Ackerman lines -->
  <line x1="150" y1="200" x2="340" y2="200" stroke="#4a9eff" stroke-width="1" opacity="0.5" stroke-dasharray="6 3"/>
  <line x1="650" y1="200" x2="362" y2="200" stroke="#4a9eff" stroke-width="1" opacity="0.5" stroke-dasharray="6 3"/>
  <!-- Labels -->
  <text x="351" y="490" font-family="JetBrains Mono" font-size="10" fill="#00c2c7" text-anchor="middle" letter-spacing="2">TELESCOPIC STEERING  ACKERMAN GEOMETRY</text>
  <text x="150" y="205" font-family="JetBrains Mono" font-size="7" fill="#00c2c7" text-anchor="middle">FL</text>
  <text x="650" y="205" font-family="JetBrains Mono" font-size="7" fill="#00c2c7" text-anchor="middle">FR</text>
  <text x="150" y="365" font-family="JetBrains Mono" font-size="7" fill="#00c2c7" text-anchor="middle">RL</text>
  <text x="650" y="365" font-family="JetBrains Mono" font-size="7" fill="#00c2c7" text-anchor="middle">RR</text>

</svg>